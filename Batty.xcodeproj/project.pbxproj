Archive/export that\n# actually goes to the notary service. A plain `-configuration Release\n# build` or the Profile action stay ACTION=build/install respectively but\n# are not what scripts/release.sh runs; keying off CONFIGURATION alone\n# would make an ordinary Release build depend on network access to Apple's\n# timestamp authority for no reason.\nif [ \"${CODE_SIGNING_ALLOWED}\" = \"YES\" ] && [ -n \"${EXPANDED_CODE_SIGN_IDENTITY:-}\" ]; then\n    if [ \"${ACTION}\" = \"install\" ]; then\n        codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --options runtime --timestamp \"${dest}/batty\"\n    else\n        codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY}\" --options runtime --timestamp=none \"${dest}/batty\"\n    fi\nelse\n    echo \"note: code signing disabled or no identity; embedded CLI left unsigned\"\nfi\n";
